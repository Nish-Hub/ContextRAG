name: CI + Qodana

on:
  push:
    branches: [ "main", "dev-codex" ]
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build project
        run: mvn clean install

  qodana:
    runs-on: ubuntu-latest
    needs: build   # 👈 IMPORTANT (runs after build)

    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: true   # 👈 better for PRs
          use-caches: true
          post-pr-comment: true
          use-annotations: true